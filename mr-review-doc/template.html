<title>MR !<NUM> — <SUJET> (<LETTRE> · i/n)</title>
<style>
  :root {
    --paper: #FBFAF7;
    --ink: #23272B;
    --muted: #6E756F;
    --accent: #14614F;
    --accent-ink: #0E4A3C;
    --accent-wash: #EDF3F0;
    --code-bg: #F4F4EE;
    --code-border: #E3E4DA;
    --rule: #E8E7DF;
    --warn-wash: #FBF3E4;
    --warn-border: #E8D9B8;
    --warn-ink: #7A5A18;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 0 24px 96px; }
  h1, h2, h3 { font-family: Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; text-wrap: balance; }

  header { padding: 64px 0 36px; border-bottom: 1px solid var(--rule); }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin-bottom: 14px;
  }
  h1 { font-size: 40px; line-height: 1.15; margin: 0 0 14px; font-weight: 700; }
  .lede { font-size: 18px; color: var(--muted); max-width: 62ch; margin: 0 0 26px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #fff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 6px 9px; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip a { color: var(--accent); text-decoration: none; }
  .chip a:hover, .toc a:hover { text-decoration: underline; }

  .toc { padding: 28px 0 8px; border-bottom: 1px solid var(--rule); }
  .toc h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-family: inherit; font-weight: 600; margin: 0 0 12px; }
  .toc ol { margin: 0; padding: 0 0 0 4px; list-style: none; counter-reset: toc; }
  .toc li { counter-increment: toc; margin: 0 0 8px; break-inside: avoid; font-size: 15px; }
  .toc li::before {
    content: counter(toc, decimal-leading-zero);
    font: 600 12px ui-monospace, Menlo, monospace;
    color: var(--accent); margin-right: 10px;
  }
  .toc a { color: var(--ink); text-decoration: none; }
  .toc .note { font-size: 13.5px; color: var(--muted); margin: 14px 0 20px; }

  section { padding: 52px 0 8px; }
  section + section { border-top: 1px solid var(--rule); }
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 6px; }
  .sec-num { font: 600 14px ui-monospace, Menlo, monospace; color: var(--accent); }
  h2.title { font-size: 26px; margin: 0; font-weight: 700; }
  .files { margin: 2px 0 18px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  p { max-width: 68ch; margin: 0 0 16px; }
  .muted { color: var(--muted); }
  code.inline {
    font: 0.86em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code-bg); border: 1px solid var(--code-border);
    border-radius: 3px; padding: 1px 5px; white-space: nowrap;
  }

  figure.diagram { margin: 24px 0; border: 1px solid var(--code-border); border-radius: 6px; background: #fff; overflow: hidden; }
  figure.diagram figcaption {
    font: 12px ui-monospace, Menlo, monospace; color: var(--muted);
    padding: 8px 14px; border-bottom: 1px solid var(--code-border); background: #FAFAF4;
  }
  .dg-scroll { overflow-x: auto; padding: 8px 4px; }
  .dg-scroll svg { display: block; width: 100%; min-width: 720px; height: auto; }
  svg .bx { fill: #FDFDFB; stroke: #C7CDC5; }
  svg .bx-hl { fill: var(--accent-wash); stroke: #AECCC0; }
  svg .bx-dim { fill: #F6F5EF; stroke: #DDDCD2; }
  svg .bx-warn { fill: var(--warn-wash); stroke: var(--warn-border); }
  svg .t { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--ink); }
  svg .t-dim { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #A0A69E; }
  svg .s { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: var(--muted); }
  svg .s-dim { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #B4BAB2; }
  svg .m { font: 11px ui-monospace, Menlo, monospace; fill: var(--accent-ink); }
  svg .lane { font: 600 11px -apple-system, sans-serif; letter-spacing: 0.14em; fill: var(--accent); }
  svg .ar { stroke: #8A9186; stroke-width: 1.5; fill: none; marker-end: url(#arr); }
  svg .ard { stroke: #8A9186; stroke-width: 1.5; fill: none; marker-end: url(#arr); stroke-dasharray: 4 4; }

  aside.context {
    background: #F6F5EF; border: 1px solid var(--rule); border-radius: 6px;
    padding: 14px 18px; margin: 0 0 24px; font-size: 15px;
  }
  aside.context .tag {
    display: inline-block; font: 600 11px/1 -apple-system, sans-serif;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  aside.context p { margin: 0 0 8px; max-width: none; }
  aside.context p:last-child { margin-bottom: 0; }
  .glossary { padding: 28px 0 12px; border-bottom: 1px solid var(--rule); }
  .glossary h2 { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-family: inherit; font-weight: 600; margin: 0 0 16px; }
  .glossary dl { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 0; }
  .glossary dt { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .glossary dd { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.55; }

  section.overview { padding: 44px 0 12px; border-bottom: 1px solid var(--rule); }
  section.overview + nav.toc { border-top: none; }

  figure.code { margin: 22px 0; border: 1px solid var(--code-border); border-radius: 6px; overflow: hidden; background: var(--code-bg); }
  figure.code figcaption {
    font: 12px ui-monospace, Menlo, monospace; color: var(--muted);
    padding: 8px 14px; border-bottom: 1px solid var(--code-border); background: #FAFAF4;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  figure.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; }
  figure.code code { font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); }
  .t-c { color: #8A9186; font-style: italic; }
  .t-s { color: #9A5B2B; }
  .t-k { color: var(--accent-ink); font-weight: 600; }
  .t-v { color: #5B5FA8; }
  .t-n { color: #5B5FA8; }
  .t-a { color: #8A9186; }

  aside.validate {
    background: var(--accent-wash); border: 1px solid #D6E4DE; border-radius: 6px;
    padding: 14px 18px; margin: 22px 0 26px; font-size: 15px; max-width: none;
  }
  aside.validate .tag {
    display: inline-block; font: 600 11px/1 -apple-system, sans-serif;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent);
    margin-bottom: 8px;
  }
  aside.validate p { margin: 0 0 8px; max-width: none; }
  aside.validate p:last-child { margin-bottom: 0; }
  aside.warn { background: var(--warn-wash); border: 1px solid var(--warn-border); border-radius: 6px; padding: 14px 18px; margin: 22px 0; font-size: 15px; }
  aside.warn .tag { display: inline-block; font: 600 11px/1 -apple-system, sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: var(--warn-ink); margin-bottom: 8px; }
  aside.warn p { margin: 0; max-width: none; }

  table { border-collapse: collapse; width: 100%; font-size: 14.5px; margin: 18px 0; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  td code { font: 12.5px ui-monospace, Menlo, monospace; }
  .ok { color: var(--accent); font-weight: 600; white-space: nowrap; }

  .chain { margin: 26px 0; }
  .chain-step { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 0 22px; align-items: start; }
  .chain-call {
    background: #fff; border: 1px solid var(--code-border); border-radius: 6px;
    padding: 10px 14px; overflow-x: auto;
  }
  .chain-call .where {
    font: 600 10.5px/1 -apple-system, sans-serif; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent); display: block; margin-bottom: 6px;
  }
  .chain-call code { font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--ink); white-space: pre; display: block; }
  .chain-note { font-size: 14px; color: var(--muted); line-height: 1.6; padding-top: 4px; }
  .chain-note b { color: var(--ink); font-weight: 600; }
  .chain-arrow {
    grid-column: 1; display: flex; align-items: center; gap: 10px;
    padding: 6px 0 6px 22px; color: var(--muted);
  }
  .chain-arrow::before { content: "↓"; color: var(--accent); font-weight: 700; }
  .chain-arrow code { font: 11.5px ui-monospace, Menlo, monospace; color: var(--accent-ink); background: var(--accent-wash); border: 1px solid #D6E4DE; border-radius: 3px; padding: 2px 7px; }
  .chain-arrow.ret::before { content: "⤴"; }
  @media (max-width: 640px) { .chain-step { grid-template-columns: 1fr; gap: 8px; } .chain-note { padding: 0 0 10px 22px; } .chain-arrow { padding-left: 8px; } }

  footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--muted); }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 640px) { h1 { font-size: 32px; } }
</style>

<!-- Squelette : remplacer les <PLACEHOLDERS>. Le CSS ci-dessus ne se modifie JAMAIS
     (identité visuelle de la série). Formats de référence : le <title> ci-dessus et
     l'eyebrow ci-dessous. -->
<div class="wrap">
<header>
  <div class="eyebrow">Revue de code · issue #<NUM> · livraison <LETTRE> (<i>/<n>)</div>
  <h1><SUJET COURT></h1>
  <p class="lede"><CE QUE LA MR LIVRE, 2-3 phrases, phrase-clé en <strong>gras</strong>.></p>
  <div class="meta">
    <span class="chip"><a href="<URL MR>">MR&nbsp;!<NUM></a></span>
    <span class="chip"><b><branche source></b> → <cible></span>
    <span class="chip"><b>N</b> commits</span>
    <span class="chip"><b>N</b> fichiers</span>
    <span class="chip"><b>N</b> tests verts <span class="muted">(+N)</span></span>
  </div>
</header>

<section class="overview" id="s0">
  <div class="sec-head"><h2 class="title">Vue d'ensemble — <angle></h2></div>
  <aside class="context">
    <span class="tag">Pour situer</span>
    <p><DOMAINE MÉTIER : les concepts de base pour un lecteur externe.></p>
    <p><POURQUOI CETTE MR : le problème, la doctrine.></p>
  </aside>
  <!-- UNIQUEMENT si la MR fait partie d'une stack ; sinon supprimer ce bloc -->
  <figure class="diagram">
    <figcaption><légende du diagramme de stack/position></figcaption>
    <div class="dg-scroll">
      <svg viewBox="0 0 760 150" role="img" aria-label="<description>">
        <defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#8A9186"/></marker></defs>
        <!-- boîtes : class="bx" (normal) / "bx-hl" (cette MR) / "bx-dim" (les autres) ;
             textes : class="t"/"t-dim" (titres), "s"/"s-dim" (sous-titres), "m" (mono), "lane" (labels de zone) ;
             flèches : <path d="M…" class="ar"/> (pleine) ou "ard" (pointillée) -->
      </svg>
    </div>
  </figure>
  <p><LES BRIQUES LIVRÉES, une phrase chacune.></p>
</section>

<nav class="toc">
  <h2>Sommaire</h2>
  <p class="note"><ordre de lecture en une ligne></p>
  <ol>
    <li><a href="#s1"><Section 1></a></li>
  </ol>
</nav>

<div class="glossary">
  <h2>Lexique</h2>
  <dl>
    <div><dt><Terme></dt><dd><Définition 1-2 phrases.></dd></div>
  </dl>
</div>

<section id="s1">
  <div class="sec-head"><span class="sec-num">01</span><h2 class="title"><Titre></h2></div>
  <div class="files"><span class="chip"><fichier.rs></span></div>
  <p><POURQUOI puis COMMENT.></p>
  <figure class="code">
    <figcaption><span><chemin/du/fichier.rs></span></figcaption>
    <!-- colorisation manuelle légère : t-k mot-clé, t-c commentaire, t-s string,
         t-v valeur/variable, t-n nombre -->
    <pre><code><span class="t-k">mot-clé</span> <span class="t-c">// commentaire</span> <span class="t-s">"string"</span> <span class="t-v">valeur</span> <span class="t-n">42</span></code></pre>
  </figure>
  <aside class="validate">
    <span class="tag">À valider</span>
    <p><DÉCISION prise, conséquence concrète, position recommandée.></p>
  </aside>

<!-- dernière section -->

<!-- Chaîne d'appel de bout en bout (structure canonique, item 6) : un .chain-step par fonction,
     un .chain-arrow entre chaque (la struct/les arguments exacts passés ; class="ret" pour la remontée). -->
<section id="sM">
  <div class="sec-head"><span class="sec-num">0M</span><h2 class="title">La chaîne d'appel, de bout en bout</h2></div>
  <div class="files"><span class="chip"><fichiers traversés></span></div>
  <p><PHRASE D'INTRO : le même chemin que les sections détaillées, vu fonction par fonction.></p>
  <div class="chain">
    <div class="chain-step">
      <div class="chain-call">
        <span class="where"><crate · fichier.rs></span>
        <code><Signature::réelle(
  arg: Type,
)></code>
      </div>
      <p class="chain-note"><CE QUI S'Y DÉCIDE : gates, constructions, décisions — avec les noms exacts.></p>
    </div>
    <div class="chain-arrow"><code><StructPassée { champs, … }></code></div>
    <!-- … répéter chain-step / chain-arrow ; dernière remontée : -->
    <div class="chain-arrow ret"><code><TypeDeRetour { … }></code></div>
    <div class="chain-step"> … </div>
  </div>
</section>

<section id="sN">
  <table>
    <thead><tr><th>Ce qui reste hors périmètre</th><th>Livré par</th></tr></thead>
    <tbody><tr><td><exclusion></td><td><MR suivante></td></tr></tbody>
  </table>
  <aside class="warn">
    <span class="tag">Avant merge</span>
    <p><ACTIONS pré-merge : DDL, re-ciblage, vérifications.></p>
  </aside>
</section>

<footer>
  <p>MR&nbsp;!<NUM> · <code class="inline"><branche></code> → <code class="inline"><cible></code> · issue&nbsp;#<NUM> · livraison <LETTRE> (<i>/<n>).</p>
</footer>
</div>
