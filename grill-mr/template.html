<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  /* Identité visuelle partagée avec mr-review-doc — ne pas re-designer. */
  :root {
    --paper: #FBFAF7;
    --ink: #23272B;
    --muted: #6E756F;
    --accent: #14614F;
    --accent-ink: #0E4A3C;
    --accent-wash: #EDF3F0;
    --code-bg: #F4F4EE;
    --code-border: #E3E4DA;
    --rule: #E8E7DF;
    --warn-wash: #FBF3E4;
    --warn-border: #E8D9B8;
    --warn-ink: #7A5A18;
    --crit-wash: #FBEAE9;
    --crit-border: #EFC5C2;
    --crit-ink: #A4261B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 84px; /* place pour la barre sticky */
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px 48px; }
  h1, h2 { font-family: Charter, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; text-wrap: balance; }

  header { padding: 56px 0 32px; border-bottom: 1px solid var(--rule); }
  .eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 14px; }
  h1 { font-size: 36px; line-height: 1.15; margin: 0 0 14px; font-weight: 700; }
  .lede { font-size: 18px; color: var(--muted); max-width: 62ch; margin: 0 0 24px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #fff; border: 1px solid var(--rule); border-radius: 4px;
    padding: 6px 9px; color: var(--muted); white-space: nowrap;
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip a { color: var(--accent); text-decoration: none; }
  .chip a:hover { text-decoration: underline; }

  section { padding: 40px 0 8px; }
  section + section { border-top: 1px solid var(--rule); }
  .sec-head { display: flex; align-items: baseline; gap: 16px; margin-bottom: 14px; }
  h2.title { font-size: 26px; margin: 0; font-weight: 700; }
  p { max-width: 72ch; margin: 0 0 14px; }
  .muted { color: var(--muted); }
  code.inline {
    font: 0.86em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--code-bg); border: 1px solid var(--code-border);
    border-radius: 3px; padding: 1px 5px;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Explainer (mêmes composants que mr-review-doc) */
  aside.context {
    background: #F6F5EF; border: 1px solid var(--rule); border-radius: 6px;
    padding: 14px 18px; margin: 0 0 24px; font-size: 15px;
  }
  aside.context .tag {
    display: inline-block; font: 600 11px/1 -apple-system, sans-serif;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    margin-bottom: 8px;
  }
  aside.context p { margin: 0 0 8px; max-width: none; }
  aside.context p:last-child { margin-bottom: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; margin: 18px 0; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  td code { font: 12.5px ui-monospace, Menlo, monospace; }

  /* Synthèse */
  .synthese { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }

  /* Cards de finding */
  article.finding {
    border: 1px solid var(--rule); border-radius: 8px; background: #fff;
    margin: 18px 0; overflow: hidden; scroll-margin-top: 16px;
  }
  article.finding[data-state="acc"] { border-color: #9CC5B4; box-shadow: 0 0 0 2px var(--accent-wash); }
  article.finding[data-state="rej"] { opacity: 0.55; }
  .f-head {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--rule); background: #FDFDFB;
  }
  .f-num { font: 600 13px ui-monospace, Menlo, monospace; color: var(--muted); }
  .f-sev {
    font: 600 11px/1 -apple-system, sans-serif; letter-spacing: 0.08em;
    text-transform: uppercase; border-radius: 4px; padding: 4px 8px; border: 1px solid;
  }
  .sev-critical { background: var(--crit-wash); color: var(--crit-ink); border-color: var(--crit-border); }
  .sev-major { background: var(--warn-wash); color: var(--warn-ink); border-color: var(--warn-border); }
  .sev-minor { background: #EAF0FA; color: #2C5697; border-color: #C9D8EF; }
  .sev-nit { background: #F1F1EC; color: var(--muted); border-color: #E0E0D8; }
  .f-cat { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
  .f-conf {
    font: 600 11px/1 -apple-system, sans-serif; letter-spacing: 0.06em;
    color: var(--warn-ink); background: var(--warn-wash);
    border: 1px dashed var(--warn-border); border-radius: 4px; padding: 4px 8px;
  }
  .f-loc { margin-left: auto; font: 12.5px ui-monospace, Menlo, monospace; text-decoration: none; }
  .f-loc:hover { text-decoration: underline; }
  .f-body { padding: 14px 16px 4px; }
  .f-title { font-weight: 600; margin-bottom: 6px; }
  .f-desc { font-size: 15px; color: #3A3F44; }
  p.f-fix { font-size: 15px; color: #3A3F44; }
  p.f-fix b { color: var(--accent-ink); }
  pre.f-ex {
    margin: 12px 0; padding: 10px 14px; background: var(--code-bg);
    border: 1px solid var(--code-border); border-radius: 6px;
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #3A3F44; overflow-x: auto;
  }

  /* Extraits de code (shiki github-light) */
  figure.snippet { margin: 14px 0; border: 1px solid var(--code-border); border-radius: 6px; overflow: hidden; background: #fff; }
  figure.snippet figcaption {
    font: 12px ui-monospace, Menlo, monospace; color: var(--muted);
    padding: 7px 14px; border-bottom: 1px solid var(--code-border); background: #FAFAF4;
  }
  figure.snippet pre { margin: 0; padding: 10px 0; overflow-x: auto; }
  figure.snippet pre > code { display: block; font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  figure.snippet .line { display: block; padding-right: 14px; }
  figure.snippet .line::before {
    content: attr(data-ln); display: inline-block; width: 3.2em; margin-right: 12px;
    text-align: right; color: #A8ADA6; user-select: none;
  }
  figure.snippet .line.hl { background: #FFF3C4; }
  figure.sugg .line.dfd { background: #FFEBE9; }
  figure.sugg .line.dfd::before { content: "−"; color: var(--crit-ink); }
  figure.sugg .line.dfa { background: #E6FFEC; }
  figure.sugg .line.dfa::before { content: "+"; color: #116329; }

  .f-comment {
    margin: 14px 0; background: var(--accent-wash); border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0; padding: 10px 14px;
  }
  .f-comment .tag {
    display: block; font: 600 11px/1 -apple-system, sans-serif;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  }
  textarea.f-edit {
    display: block; width: 100%; margin: 0; padding: 4px 6px;
    border: 1px solid transparent; border-radius: 4px; background: transparent;
    font: inherit; font-size: 14.5px; line-height: 1.6; color: var(--ink);
    resize: vertical; field-sizing: content; min-height: 2.6em;
  }
  textarea.f-edit:hover { border-color: #BED3CB; }
  textarea.f-edit:focus { background: #fff; border-color: var(--accent); outline: none; }

  .f-actions { display: flex; gap: 10px; padding: 4px 16px 14px; }
  button.act {
    font: 600 13px -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--rule);
    background: #fff; color: var(--ink); cursor: pointer;
  }
  button.act:hover { border-color: var(--muted); }
  button.btn-acc[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn-rej[aria-pressed="true"] { background: var(--crit-ink); border-color: var(--crit-ink); color: #fff; }

  footer.docfoot { margin-top: 48px; padding-top: 22px; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--muted); }

  /* Barre sticky */
  #bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center; gap: 20px;
    padding: 12px 16px; background: #fff; border-top: 1px solid var(--rule);
    box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
  }
  .bar-counts { font-size: 14px; color: var(--muted); }
  .bar-counts b { color: var(--ink); }
  #copy-btn {
    font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif;
    padding: 9px 18px; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff; cursor: pointer;
  }
  #copy-btn:hover { background: var(--accent-ink); }
  #copy-btn.done { background: var(--accent-ink); }

  @media (max-width: 640px) {
    h1 { font-size: 28px; }
    .f-loc { margin-left: 0; width: 100%; }
    #bar { flex-direction: column; gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1>{{H1}}</h1>
  <p class="lede">{{LEDE}}</p>
  <div class="meta">
    {{CHIPS}}
  </div>
</header>

<section class="overview" id="s0">
  {{EXPLAINER}}
</section>

<section id="findings">
  <div class="sec-head"><h2 class="title">Findings</h2></div>
  <div class="synthese">{{SYNTHESE}}</div>
  {{FINDINGS}}
</section>

<footer class="docfoot">
  <p>{{FOOTNOTE}}</p>
</footer>
</div>

<div id="bar">
  <div class="bar-counts">
    <b id="n-acc">0</b> acceptés · <b id="n-rej">0</b> refusés · <b id="n-rest">{{TOTAL}}</b> restants
  </div>
  <button id="copy-btn" type="button">Copier la décision</button>
</div>

<script>
  const DOC_KEY = {{DOC_KEY_JSON}};
  const DECISION_PREFIX = {{DECISION_PREFIX_JSON}};

  const state = JSON.parse(localStorage.getItem(DOC_KEY) || '{}');
  const save = () => localStorage.setItem(DOC_KEY, JSON.stringify(state));
  const cards = [...document.querySelectorAll('article.finding')];

  function refresh() {
    let acc = 0, rej = 0;
    for (const c of cards) {
      const s = state[c.dataset.id] || '';
      c.dataset.state = s;
      c.querySelector('.btn-acc').setAttribute('aria-pressed', s === 'acc');
      c.querySelector('.btn-rej').setAttribute('aria-pressed', s === 'rej');
      if (s === 'acc') acc++;
      else if (s === 'rej') rej++;
    }
    document.getElementById('n-acc').textContent = acc;
    document.getElementById('n-rej').textContent = rej;
    document.getElementById('n-rest').textContent = cards.length - acc - rej;
  }

  const toggle = (id, v) => {
    if (state[id] === v) delete state[id];
    else state[id] = v;
    save();
    refresh();
  };

  for (const c of cards) {
    c.querySelector('.btn-acc').addEventListener('click', () => toggle(c.dataset.id, 'acc'));
    c.querySelector('.btn-rej').addEventListener('click', () => toggle(c.dataset.id, 'rej'));
    // édition du commentaire : persistée sous 'e<id>', reset si retour au texte d'origine
    const ta = c.querySelector('.f-edit');
    const k = 'e' + c.dataset.id;
    if (state[k] != null) ta.value = state[k];
    ta.addEventListener('input', () => {
      if (ta.value === ta.defaultValue) delete state[k];
      else state[k] = ta.value;
      save();
    });
  }

  // [1,3,7,8,9] -> "1,3,7-9" ; vide -> "-"
  function ranges(ns) {
    ns = [...ns].sort((a, b) => a - b);
    const out = [];
    for (let i = 0; i < ns.length;) {
      let j = i;
      while (j + 1 < ns.length && ns[j + 1] === ns[j] + 1) j++;
      out.push(i === j ? `${ns[i]}` : `${ns[i]}-${ns[j]}`);
      i = j + 1;
    }
    return out.join(',') || '-';
  }

  document.getElementById('copy-btn').addEventListener('click', async () => {
    const acc = [], rej = [], edits = [];
    for (const c of cards) {
      const s = state[c.dataset.id];
      if (s === 'acc') acc.push(+c.dataset.id);
      else if (s === 'rej') rej.push(+c.dataset.id);
      // commentaire modifié d'un finding accepté → joint sous la ligne de décision
      const ta = c.querySelector('.f-edit');
      if (s === 'acc' && ta.value !== ta.defaultValue) edits.push(`#${c.dataset.id}\n${ta.value.trim()}`);
    }
    let text = `${DECISION_PREFIX} accept:${ranges(acc)} reject:${ranges(rej)}`;
    if (edits.length) text += '\n\n' + edits.join('\n\n');
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const t = document.createElement('textarea');
      t.value = text;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      t.remove();
    }
    const b = document.getElementById('copy-btn');
    b.classList.add('done');
    b.textContent = 'Copié ✓';
    setTimeout(() => { b.classList.remove('done'); b.textContent = 'Copier la décision'; }, 1600);
  });

  refresh();
</script>
</body>
</html>
